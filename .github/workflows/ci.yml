name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: delegate-to-claude tests
        run: |
          PYTHONPATH=delegate-to-claude/scripts:scripts python3 -m unittest discover -s delegate-to-claude/tests -p 'test_*.py' -v
      - name: delegate-to-antigravity tests
        run: |
          PYTHONPATH=delegate-to-antigravity/scripts:scripts python3 -m unittest discover -s delegate-to-antigravity/tests -p 'test_*.py' -v
      - name: delegation_policy tests
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: intent-writer tests
        run: |
          PYTHONPATH=intent-writer/scripts:scripts python3 -m unittest discover -s intent-writer/tests -p 'test_*.py' -v
